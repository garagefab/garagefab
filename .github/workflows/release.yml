name: Release

# Release workflow: a `v*` tag triggers GoReleaser, which cross-compiles the four
# supported targets, packages them, writes checksums, and publishes a GitHub
# Release. GoReleaser is downloaded by the action — no local install is needed.
#
# The UI is built inside GoReleaser's `before` hook (see .goreleaser.yaml),
# because the dashboard is embedded into the binary via `//go:embed ui/dist`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so GoReleaser can build the changelog from git.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
